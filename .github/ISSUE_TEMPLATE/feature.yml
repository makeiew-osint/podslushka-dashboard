name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should be added?
      description: Describe the feature and the user problem it solves.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: What would success look like?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request does not ask for private data collection or credential access.
          required: true
