name: Monitor Podslushka DB

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor
        uses: actions/checkout@v4

      - name: Download previous state
        uses: actions/download-artifact@v4
        with:
          name: site-monitor-state
          path: monitor-state
          if-no-artifact-found: ignore

      - name: Check website
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://podslushka-dashboard.onrender.com/' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_UPDATES_CHAT_ID: ${{ secrets.TELEGRAM_UPDATES_CHAT_ID }}
          MONITOR_STATE_FILE: monitor-state/monitor-state.json
        run: python site_monitor.py

      - name: Save current state
        uses: actions/upload-artifact@v4
        with:
          name: site-monitor-state
          path: monitor-state/monitor-state.json
          overwrite: true
          retention-days: 7
