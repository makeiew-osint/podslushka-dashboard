services:
  - type: web
    name: podslushka-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python db_viewer.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: DASHBOARD_SYNC_SECRET
        sync: false
      - key: DASHBOARD_SYNC_URL
        value: https://podslushka-dashboard.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen3.8-27B
      - key: AI_PROVIDER
        value: gemini
      - key: TELEGRAM_BOT_USERNAME
        value: schoolmboy202648_bot_bot
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_BASE_URL
        value: https://podslushka-dashboard.onrender.com
      - key: OAUTH_SIGNING_SECRET
        sync: false
      - key: MULTIBOT_ENCRYPTION_KEY
        sync: false
      - key: OWNER_2FA_SECRET
        sync: false
      - key: OWNER_2FA_REQUIRED
        value: "false"
      - key: RUN_BOT_IN_WEB
        value: "true"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: TELEGRAM_UPDATES_CHAT_ID
        value: "-10042000444335"
      - key: SITE_MAINTENANCE_MODE
        value: "false"
