services:
  - type: web
    name: podslushka-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python db_viewer.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: DASHBOARD_SYNC_SECRET
        sync: false
      - key: DASHBOARD_SYNC_URL
        value: https://podslushka-dashboard.onrender.com
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: schoolmboy202648_bot_bot
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_BASE_URL
        value: https://podslushka-dashboard.onrender.com
      - key: OAUTH_SIGNING_SECRET
        sync: false
      - key: OWNER_2FA_SECRET
        sync: false
      - key: OWNER_2FA_REQUIRED
        value: "false"
      - key: RUN_BOT_IN_WEB
        value: "true"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_ID
        value: "-10042000444335"
